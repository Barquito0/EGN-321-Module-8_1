name: Module 8.1 operator handoff checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Test operator helpers
        run: python -m pytest -q
      - name: Fetch the unchanged previous-course application
        run: python scripts/prepare_application.py
      - name: Check operator instructions against installed app
        run: python scripts/preflight.py
      - name: Run inherited application regression tests
        run: python scripts/run_application_tests.py
